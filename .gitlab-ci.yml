stages:
  - mirror

sync_to_github:
  stage: mirror
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    # Récupère tout l'historique et toutes les branches pour un miroir propre
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    GIT_SSL_NO_VERIFY: "true"
  script:
    - git remote add github https://LR63:${GITHUB_TOKEN}@github.com/LR63/Milos-Hospital.git
    - git push github HEAD:main --force
    - git push github --tags --force
  only:
    # Déclenche la synchronisation sur vos branches principales (ex: main, develop) et les tags
    - main
    - tags